name: Deploy

on:
  push:
    branches: [main]

env:
  DEPLOY_PATH: /home/deploy/apps/maximeboulogne.com
  PM2_PROCESS_NAME: portfolio

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Rsync build to VPS
        uses: easingthemes/ssh-deploy@v2.1.5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: 22
          SOURCE: .next/standalone/
          TARGET: ${{ env.DEPLOY_PATH }}/

      - name: Restart app via PM2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            cd ${{ env.DEPLOY_PATH }}
            pm2 restart ${{ env.PM2_PROCESS_NAME }} --update-env || pm2 start server.js --name ${{ env.PM2_PROCESS_NAME }}
            pm2 save