name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            cd /home/deploy/apps/maximeboulogne.com

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            npm ci
            npm run build

            pm2 restart portfolio --update-env
            pm2 save

            node --experimental-strip-types --env-file=.env --import "data:text/javascript,import { register } from 'node:module'; import { pathToFileURL } from 'node:url'; register('./scripts/node-test-loader.mjs', pathToFileURL('./'));" scripts/reindex-work-search.ts || true